name: Sync verified complete MIUI 14 firmware archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firmware-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunluo-miui-firmware-sync
  cancel-in-progress: false

jobs:
  sync-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main without the previous LFS archive
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          lfs: false
          persist-credentials: true

      - name: Install 7zip and Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full git-lfs

      - name: Download new archive and validate all required images
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --output /tmp/yunluo-miui-new.7z 'https://files.catbox.moe/1h83n6.7z'
          test "$(stat -c%s /tmp/yunluo-miui-new.7z)" -gt 1000000
          sha256sum /tmp/yunluo-miui-new.7z
          7z t /tmp/yunluo-miui-new.7z
          7z l -slt /tmp/yunluo-miui-new.7z > /tmp/yunluo-new-list.txt
          for img in boot.img vendor_boot.img vendor_dlkm.img odm_dlkm.img dtbo.img; do
            if ! grep -Fxq "Path = $img" /tmp/yunluo-new-list.txt; then
              echo "::error::Missing required MIUI image: $img"
              exit 1
            fi
          done
          mkdir -p /tmp/yunluo-check
          7z x -y -o/tmp/yunluo-check /tmp/yunluo-miui-new.7z boot.img vendor_boot.img vendor_dlkm.img odm_dlkm.img > /dev/null
          printf '%s  %s\n' \
            'f2a20fd26ebaee6eee4e1d9fb0602afb97be7c3a8072ceb3c0e1bb840953ab95' '/tmp/yunluo-check/boot.img' \
            'd9724f2712fb81745c26519e430375bbc9c759ac6df056496a404ef8ee456950' '/tmp/yunluo-check/vendor_boot.img' \
            '41f4c4b443bbf10cb6522874738df8c3e3351ade8f2e20a06da71d171da83ce0' '/tmp/yunluo-check/vendor_dlkm.img' \
            '9de9cd73c9d6274f7aa21662a7a863a330abeeef279650155ce18d58cd6082c0' '/tmp/yunluo-check/odm_dlkm.img' | sha256sum -c
          echo 'All required images present; four images match the uploaded MIUI 14 baseline.'

      - name: Commit validated replacement on main (no force push)
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs track '*.7z'
          cp /tmp/yunluo-miui-new.7z archive.7z
          git add .gitattributes archive.7z
          if git diff --cached --quiet; then
            echo 'Archive content unchanged; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace MIUI LFS archive with verified complete stock images'
          git push origin HEAD:main
