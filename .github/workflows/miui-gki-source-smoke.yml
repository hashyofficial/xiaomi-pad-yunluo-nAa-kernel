name: MIUI 14 GKI source compile smoke (NOT FLASHABLE)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.config.yunluo.miui14-gki-preview'
      - 'arch/Kconfig'
      - 'fs/userfaultfd.c'
      - 'net/vmw_vsock/af_vsock.c'
      - 'net/sched/sch_fifo.c'
      - 'drivers/media/usb/uvc/uvc_driver.c'
      - 'kernel/printk/printk.c'
      - 'mm/page_pinner.c'
      - 'net/netfilter/ipvs/ip_vs_ctl.c'
      - 'net/batman-adv/network-coding.c'
      - '.github/workflows/miui-gki-source-smoke.yml'

permissions:
  contents: read

jobs:
  config-and-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM: '1'
      LLVM_IAS: '1'
      CROSS_COMPILE: 'aarch64-linux-gnu-'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev libelf-dev binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Cache pinned AOSP Android Clang 12.0.5 toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: /tmp/yunluo-android-clang
          key: ${{ runner.os }}-yunluo-aosp-clang-r416183b-bd96dfe349c96268-v1

      - name: Obtain original Android 12 Clang 12.0.5 (r416183b) from AOSP
        shell: bash
        run: |
          set -euo pipefail
          url='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz'
          mkdir -p /tmp/yunluo-android-clang
          if ! test -x /tmp/yunluo-android-clang/bin/clang; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 780 "$url" --output /tmp/yunluo-clang-r416183b.tar.gz
            test "$(wc -c < /tmp/yunluo-clang-r416183b.tar.gz)" -gt 1000000
            tar -xzf /tmp/yunluo-clang-r416183b.tar.gz -C /tmp/yunluo-android-clang
          else
            echo 'Using cached pinned Android Clang r416183b.'
          fi
          test -x /tmp/yunluo-android-clang/bin/clang
          test -x /tmp/yunluo-android-clang/bin/llvm-nm
          test -x /tmp/yunluo-android-clang/bin/llvm-ar
          /tmp/yunluo-android-clang/bin/clang --version | sed -n '1,2p'
          /tmp/yunluo-android-clang/bin/clang --version | grep -q 'clang version 12.0.5'
          echo '/tmp/yunluo-android-clang/bin' >> "$GITHUB_PATH"

      - name: Build Xiaomi 5.10.101 GKI configuration (not stock 5.10.168)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out report
          make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 gki_defconfig 2>&1 | tee report/kconfig.log
          {
            echo '--- compiler and LLVM build tools ---'
            command -v clang && clang --version | sed -n '1,2p'
            command -v ld.lld && ld.lld --version
            command -v llvm-nm && llvm-nm --help | sed -n '1,2p'
            command -v llvm-ar && llvm-ar --help | sed -n '1,2p'
            echo '--- GKI LTO/CFI eligibility ---'
            echo "CROSS_COMPILE=$CROSS_COMPILE"
            command -v aarch64-linux-gnu-elfedit
            echo "ARM64 assembler / KASAN prerequisites"
            grep -E '^(# )?CONFIG_(ARM64_MTE|ARM64_AS_HAS_MTE|ARM64_TAGGED_ADDR_ABI|AS_HAS_ARMV8_5|ARM64_PAN|AS_HAS_LSE_ATOMICS|HAVE_ARCH_KASAN_HW_TAGS|KASAN_HW_TAGS|KASAN_GENERIC|FTRACE_MCOUNT_USE_RECORDMCOUNT)' out/.config || true
            echo "PATH=$PATH"
            echo "LLVM=$LLVM LLVM_IAS=$LLVM_IAS"
            command -v clang && command -v llvm-nm && command -v llvm-ar
            echo "Tool probe:"
            llvm-nm --version | sed -n '1,2p'
            llvm-ar --version | sed -n '1,2p'
            test "$LLVM" -eq 1 && echo "LLVM variable present"
            test "$LLVM_IAS" -eq 1 && echo "LLVM_IAS variable present"
            grep -E '(CONFIG_(CC_IS_CLANG|LD_IS_LLD|CLANG_VERSION|KALLSYMS|HAS_LTO_CLANG|ARCH_SUPPORTS_LTO_CLANG|FTRACE_MCOUNT_USE_RECORDMCOUNT|COMPILE_TEST|GCOV_KERNEL|LTO_|CFI_CLANG|MODVERSIONS|ANDROID_VENDOR_HOOKS|ARCH_MEDIATEK|KASAN|SHADOW_CALL_STACK))' out/.config || true
          } | tee report/llvm-eligibility.txt
          grep -E '(CONFIG_(MODVERSIONS|CFI_CLANG|ANDROID_VENDOR_HOOKS|LTO_CLANG|ARCH_MEDIATEK))' out/.config > report/critical-config.txt || true
          cat report/critical-config.txt
          for flag in CONFIG_MODVERSIONS CONFIG_CFI_CLANG CONFIG_ANDROID_VENDOR_HOOKS CONFIG_LTO_CLANG_FULL; do
            if ! grep -Fxq "${flag}=y" out/.config; then
              echo "::error::Kernel config did not enable ${flag}; inspect report/critical-config.txt and compiler version"
              exit 1
            fi
          done
          if grep -Fxq 'CONFIG_ARCH_MEDIATEK=y' out/.config; then
            echo '::error::Generic MIUI GKI kernel unexpectedly includes MediaTek hardware drivers'
            exit 1
          fi
          sed -n '1,10p' Makefile > report/source-version.txt
          grep -E 'CONFIG_(MODVERSIONS|CFI_CLANG|ANDROID_VENDOR_HOOKS|LTO_CLANG_FULL)=' out/.config > report/selected-config.txt
          echo 'Baseline Kconfig selected; this source is still Linux 5.10.101.'

      - name: Prepare GKI kernel build headers
        shell: bash
        run: |
          set -o pipefail
          make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j2 prepare 2>&1 | tee report/prepare.log

      - name: Compile directly modified kernel source objects
        shell: bash
        run: |
          set -o pipefail
          make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j2 fs/userfaultfd.o net/vmw_vsock/af_vsock.o net/sched/sch_fifo.o drivers/media/usb/uvc/uvc_driver.o kernel/printk/printk.o mm/page_pinner.o 2>&1 | tee report/patched-objects.log

      - name: Check required page_pinner export is present in compiled GKI object
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'CONFIG_PAGE_PINNER=y' out/.config
          llvm-nm -a out/mm/page_pinner.o > report/page-pinner-llvm-symbols.txt
          grep -q '__ksymtab_page_pinner_inited' report/page-pinner-llvm-symbols.txt
          echo 'PASS: compiled page_pinner.o contains the export; MIUI CRC compatibility still untested.'

      - name: Compile IPVS and BATMAN-adv in isolated optional Kconfig (not stock)
        shell: bash
        run: |
          set -euo pipefail
          # Stock GKI does not enable these optional protocols. Do not alter
          # out/.config, which has the stock-style full-LTO/CFI settings.
          mkdir -p optional_out
          make O="$PWD/optional_out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 gki_defconfig \
            > report/optional-defconfig.log 2>&1
          scripts/config --file optional_out/.config -e IP_VS -e BATMAN_ADV -e BATMAN_ADV_NC
          make O="$PWD/optional_out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig \
            >> report/optional-defconfig.log 2>&1
          for opt in CONFIG_IP_VS CONFIG_BATMAN_ADV CONFIG_BATMAN_ADV_NC \
                     CONFIG_LTO_CLANG_FULL CONFIG_CFI_CLANG CONFIG_KASAN_HW_TAGS; do
            grep -Fxq "$opt=y" optional_out/.config || { echo "::error::Optional test config failed $opt"; exit 1; }
          done
          make O="$PWD/optional_out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j2 \
            net/netfilter/ipvs/ip_vs_ctl.o net/batman-adv/network-coding.o \
            2>&1 | tee report/optional-object-build.log
          echo 'PASS: optional IPVS/BATMAN source compiled in isolated enabled configuration' | tee report/optional-verification.txt

      - name: Preserve build diagnostics only — never a boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miui-gki-101-source-smoke-logs
          path: report/
          if-no-files-found: warn
          retention-days: 7
