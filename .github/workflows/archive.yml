name: Upload 7z Archive to Kernel Repo

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Download 7z Archive
        run: |
          echo "Downloading archive from Catbox..."
          curl -L -o archive.7z "https://files.catbox.moe/pj4tmx.7z"
          
          # Check file size in megabytes
          FILE_SIZE=$(du -m archive.7z | cut -f1)
          echo "Downloaded file size: ${FILE_SIZE} MB"

      - name: Handle Large Files with Git LFS
        run: |
          sudo apt-get install -y git-lfs
          git lfs install
          
          # Track 7z files with LFS to bypass GitHub's 100MB limit
          git lfs track "*.7z"
          git add .gitattributes

      - name: Commit and Push Archive
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "hashyofficial"
          git config user.email "hashyofficial@gmail.com"
          
          # Increase Git HTTP postBuffer for large payloads
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 100M

          git add archive.7z
          git commit -m "Add prebuilt archive from Catbox (pj4tmx.7z)"
          
          # Push changes back to main (never force-push kernel source history)
          git push origin main
