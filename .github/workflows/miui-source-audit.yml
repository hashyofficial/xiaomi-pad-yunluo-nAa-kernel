name: MIUI kernel source and firmware inventory

on:
  push:
    branches: [main]
    paths:
      - 'fs/userfaultfd.c'
      - 'security/YUNLUO_BACKPORTS.md'
      - 'scripts/yunluo/**'
      - '.github/workflows/miui-source-audit.yml'
      - 'archive.7z'
      - 'security/MIUI_GKI_RECONSTRUCTION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-backports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fixes are in real kernel source
        run: python3 scripts/yunluo/verify_backports.py

  firmware-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Confirm exact LFS archive
        run: |
          set -euo pipefail
          git lfs pull --include="archive.7z"
          pointer="$(git show HEAD:archive.7z)"
          expected_sha="$(printf '%s\n' "$pointer" | sed -n 's/^oid sha256://p')"
          expected_size="$(printf '%s\n' "$pointer" | sed -n 's/^size //p')"
          test "${#expected_sha}" -eq 64
          test "$(wc -c < archive.7z)" -eq "$expected_size"
          printf '%s  %s\n' "$expected_sha" archive.7z | sha256sum -c
      - name: Install 7z tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full kmod erofs-utils liblz4-1
      - name: List archive without extracting the images
        run: |
          set -euo pipefail
          mkdir -p audit
          sha256sum archive.7z > audit/archive.sha256
          7z l -slt archive.7z > audit/archive-list.txt
          for required in boot.img vendor_boot.img vendor_dlkm.img odm_dlkm.img dtbo.img; do
            grep -Fxq "Path = $required" audit/archive-list.txt || { echo "::error::Missing $required"; exit 1; }
          done
          {
            echo "MIUI archive: exact LFS SHA-256 validated"
            echo "Bytes: $(wc -c < archive.7z)"
            echo "File names (first 150):"
            grep '^Path = ' audit/archive-list.txt | head -150
          } | tee audit/SUMMARY.txt
      - name: Compare archived partitions with stock image references
        run: |
          set -euo pipefail
          mkdir -p extract
          7z x -y -oextract archive.7z boot.img vendor_boot.img vendor_dlkm.img odm_dlkm.img dtbo.img > audit/selective-extract.log
          sha256sum extract/*.img | tee audit/partition-sha256.txt
          {
            echo 'Comparison with separately uploaded MIUI reference images:'
            for p in boot vendor_boot vendor_dlkm odm_dlkm; do
              case "$p" in
                boot) reference="f2a20fd26ebaee6eee4e1d9fb0602afb97be7c3a8072ceb3c0e1bb840953ab95" ;;
                vendor_boot) reference="d9724f2712fb81745c26519e430375bbc9c759ac6df056496a404ef8ee456950" ;;
                vendor_dlkm) reference="41f4c4b443bbf10cb6522874738df8c3e3351ade8f2e20a06da71d171da83ce0" ;;
                odm_dlkm) reference="9de9cd73c9d6274f7aa21662a7a863a330abeeef279650155ce18d58cd6082c0" ;;
              esac
              current=$(sha256sum "extract/${p}.img" | cut -d' ' -f1)
              if [ "$current" = "$reference" ]; then
                echo "$p: MATCH ($current)"
              else
                echo "::error::$p differs from MIUI 14 reference (archive: $current; uploaded: $reference)"
                exit 1
              fi
            done
          } | tee audit/REFERENCE_COMPARISON.txt
          python3 scripts/yunluo/inspect_stock_boot.py extract/boot.img --output-config audit/stock-miui14-kconfig.txt --output-json audit/stock-boot.json
      - name: Extract EROFS modules and inventory required ABI symbols (read-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extract/vendor-modules extract/odm-modules
          fsck.erofs --extract="$PWD/extract/vendor-modules" extract/vendor_dlkm.img > audit/vendor-erofs-extraction.log 2>&1
          fsck.erofs --extract="$PWD/extract/odm-modules" extract/odm_dlkm.img > audit/odm-erofs-extraction.log 2>&1
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/xiaomi-mt6789-devs/kernel_xiaomi-yunluo/vic/arch/arm64/configs/gki_defconfig' \
            --output audit/lineage-vic-gki_defconfig.txt
          python3 scripts/yunluo/audit_stock_abi.py \
            --vendor-boot extract/vendor_boot.img \
            --vendor-dlkm-dir extract/vendor-modules \
            --odm-dlkm-dir extract/odm-modules \
            --stock-config audit/stock-miui14-kconfig.txt \
            --source-gki-config arch/arm64/configs/gki_defconfig \
            --source-yunluo-config arch/arm64/configs/yunluo_defconfig \
            --lineage-gki-config audit/lineage-vic-gki_defconfig.txt \
            --output audit > audit/ABI_CONSOLE_OUTPUT.txt
          cat audit/ABI_CONSOLE_OUTPUT.txt | head -150
          rm -rf extract
      - uses: actions/upload-artifact@v4
        with:
          name: miui-stock-firmware-inventory
          path: audit/
          retention-days: 7
