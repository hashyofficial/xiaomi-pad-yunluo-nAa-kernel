name: Upload Google Drive Archive to Kernel Repo

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Install gdown and Git LFS
        run: |
          pip install gdown
          sudo apt-get update && sudo apt-get install -y git-lfs p7zip-full
          git lfs install

      - name: Download Archive from Google Drive
        run: |
          echo "Downloading archive using gdown..."
          gdown 1MuknQ5cjDynue1UXUcxsiC9KQRZlqkfh -O archive.7z
          
          # Validate archive before pushing it to main
          set -euo pipefail
          FILE_SIZE=$(stat -c%s archive.7z)
          test "$FILE_SIZE" -gt 1000000
          echo "Downloaded file size: $FILE_SIZE bytes"
          7z t archive.7z
          7z l -slt archive.7z > /tmp/yunluo-archive-list.txt
          for required in boot.img vendor_boot.img vendor_dlkm.img odm_dlkm.img dtbo.img; do
            grep -Fxq "Path = $required" /tmp/yunluo-archive-list.txt || { echo "::error::Missing $required"; exit 1; }
          done
          mkdir -p /tmp/miui-check
          7z x -y -o/tmp/miui-check archive.7z boot.img vendor_boot.img vendor_dlkm.img odm_dlkm.img > /dev/null
          printf '%s  %s\n' \
            'f2a20fd26ebaee6eee4e1d9fb0602afb97be7c3a8072ceb3c0e1bb840953ab95' /tmp/miui-check/boot.img \
            'd9724f2712fb81745c26519e430375bbc9c759ac6df056496a404ef8ee456950' /tmp/miui-check/vendor_boot.img \
            '41f4c4b443bbf10cb6522874738df8c3e3351ade8f2e20a06da71d171da83ce0' /tmp/miui-check/vendor_dlkm.img \
            '9de9cd73c9d6274f7aa21662a7a863a330abeeef279650155ce18d58cd6082c0' /tmp/miui-check/odm_dlkm.img | sha256sum --check
          echo 'MIUI stock images match the kernel baseline.'

      - name: Track with Git LFS
        run: |
          git lfs track "*.7z"
          git add .gitattributes

      - name: Commit and Push Archive
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "hashyofficial"
          git config user.email "hashyofficial@gmail.com"
          
          # Increase Git HTTP postBuffer for large payloads
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 100M

          git add archive.7z
          if git diff --cached --quiet; then
            echo 'Archive already matches; no changes needed.'
            exit 0
          fi
          git commit -m "Add validated MIUI stock archive from Google Drive"
          
          # Push changes back to main
          git push origin main
